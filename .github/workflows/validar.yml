name: validar
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validar
      - run: npm run design
      - run: npx tsc --noEmit || true
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
